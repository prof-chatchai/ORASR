[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orasr"
version = "1.3.0"
description = "ORASR: Operational Reasoning-Action Safety Routing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orasr*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
